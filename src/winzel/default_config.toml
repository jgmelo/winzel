# Configuração padrão do winzel.
# Para mudar algo, crie %APPDATA%\winzel\config.toml só com as chaves desejadas;
# elas se sobrepõem a estas.

[display]
# false: usa [OK] [!] [X] [-] [ERRO] em vez de emojis (SPEC, risco 4).
emoji = true

# Tempo máximo de cada checagem, em segundos.
[checks.programs]
timeout_s = 30

[checks.startup]
timeout_s = 30

[checks.store_apps]
timeout_s = 30

[checks.scheduled_tasks]
timeout_s = 30

[checks.services]
timeout_s = 30

[checks.pip_global]
timeout_s = 30
# Python global (fora de venvs). Vazio: launcher `py -3.14`.
# Aceita um caminho ("C:\\Python314\\python.exe") ou uma lista (["py", "-3.13"]).
python = ""

[checks.wsl_distros]
timeout_s = 20

# Retenção (SPEC 6.3): snapshots automáticos mais antigos que isto são reduzidos
# a um por mês. Manuais, milestones e suas referências nunca são apagados.
[retention]
keep_all_days = 90

# --- Métricas (fase 4) ---------------------------------------------------------
[checks.disk_c]
timeout_s = 10
path = "C:\\"
warn_below_pct = 20
problem_below_pct = 10

[checks.dev_drive]
timeout_s = 20
letter = "D:"
# Caminho do arquivo .vhdx do Dev Drive. Vazio: descoberto automaticamente.
vhdx = ""
warn_below_pct = 20

[checks.clutter]
timeout_s = 60
sandboxes = ["C:\\Sandbox"]
temp = "%TEMP%"
# O limite vale para a soma de sandboxes e Temp.
warn_above_gb = 5

[checks.battery]
timeout_s = 30
warn_below_pct = 80
problem_below_pct = 60

[checks.ssd]
timeout_s = 30
warn_above_wear_pct = 50
