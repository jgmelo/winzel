# Configuração padrão do winzel.
# Para mudar algo, crie %APPDATA%\winzel\config.toml só com as chaves desejadas;
# elas se sobrepõem a estas.

[display]
# false: usa [OK] [!] [X] [-] [ERRO] em vez de emojis (SPEC, risco 4).
emoji = true

# Tempo máximo de cada checagem, em segundos.
[checks.programs]
timeout_s = 30

[checks.startup]
timeout_s = 30

[checks.store_apps]
timeout_s = 30

[checks.scheduled_tasks]
timeout_s = 30

[checks.services]
timeout_s = 30

[checks.pip_global]
timeout_s = 30
# Python global (fora de venvs). Vazio: launcher `py -3.14`.
# Aceita um caminho ("C:\\Python314\\python.exe") ou uma lista (["py", "-3.13"]).
python = ""

[checks.wsl_distros]
timeout_s = 20

# Retenção (SPEC 6.3): snapshots automáticos mais antigos que isto são reduzidos
# a um por mês. Manuais, milestones e suas referências nunca são apagados.
[retention]
keep_all_days = 90

# --- Métricas (fase 4) ---------------------------------------------------------
[checks.disk_c]
timeout_s = 10
path = "C:\\"
warn_below_pct = 20
problem_below_pct = 10

[checks.dev_drive]
timeout_s = 20
letter = "D:"
# Caminho do arquivo .vhdx do Dev Drive. Vazio: descoberto automaticamente.
vhdx = ""
warn_below_pct = 20

[checks.clutter]
timeout_s = 60
sandboxes = ["C:\\Sandbox"]
temp = "%TEMP%"
# O limite vale para a soma de sandboxes e Temp.
warn_above_gb = 5

[checks.battery]
timeout_s = 30
warn_below_pct = 80
problem_below_pct = 60

[checks.ssd]
timeout_s = 30
warn_above_wear_pct = 50

# --- Atualizações, segurança e backup (fase 5) -----------------------------------
[checks.winget_updates]
timeout_s = 60

[checks.windows_update]
# A busca do Windows Update é lenta.
timeout_s = 120

[checks.defender]
timeout_s = 30
warn_signature_days = 3

[checks.encryption]
timeout_s = 30

[checks.restore_point]
timeout_s = 30
warn_after_days = 30

[checks.git_repos]
timeout_s = 60
projects_dir = "D:\\projetos"

# --- Ações (aba Ações) -------------------------------------------------------------
[actions.sandboxie]
start_exe = "C:\\Program Files\\Sandboxie-Plus\\Start.exe"
# Pasta das caixas do usuário (FileRootPath do Sandboxie: C:\Sandbox\%USER%\%SANDBOX%).
boxes_dir = "C:\\Sandbox\\%USERNAME%"
